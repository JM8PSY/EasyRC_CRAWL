# robot_localization EKF（odom → base_footprint）
# 入力: rf2o（x, y, yaw）/ D455 IMU（vyaw）/ cugo_base の /wheel_odom（vx, vyaw。指令ベースなので共分散は大きい）
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # config の並び: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]

    # rf2o_laser_odometry（共分散を出さないので EKF はほぼ全面的に信用する）
    odom0: /odom_rf2o
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: true
    odom0_queue_size: 5

    # D455 IMU（unite_imu_method: 2）。姿勢は含まれないので角速度 z のみ
    imu0: /camera/camera/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false

    # cugo_base の指令ベース推定（エンコーダなし）
    odom1: /wheel_odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 5
