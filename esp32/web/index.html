<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CuGo RC</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <span class="title">CuGo RC</span>
    <span id="conn" class="badge off">切断</span>
    <span id="role" class="badge"></span>
    <span id="mode" class="badge"></span>
  </header>

  <main>
    <div class="meters">
      <div class="meter">
        <div class="track"><div id="bar-l" class="bar"></div></div>
        <div class="label">左 <span id="val-l">0.00</span></div>
      </div>
      <div class="meter">
        <div class="track"><div id="bar-r" class="bar"></div></div>
        <div class="label">右 <span id="val-r">0.00</span></div>
      </div>
    </div>
  </main>

  <section class="limit">
    <label for="max">出力上限</label>
    <input id="max" type="range" min="5" max="100" step="5" value="100">
    <span id="max-val" class="limit-val">100%</span>
  </section>

  <section class="auto">
    <label><input id="auto" type="checkbox" disabled> 自律走行を許可</label>
    <span class="auto-note">Jetson の指令で走ります（操縦すると手動に戻ります）</span>
  </section>

  <section class="controls">
    <button id="stop" class="stop" type="button">停止<br><small>Space</small></button>
    <div class="help">
      <b>W/S</b> 前進/後退　<b>A/D</b> 旋回<br>
      <b>Shift</b> 低速　<b>Space</b> 停止
    </div>
    <div id="joy" class="joy"><div id="knob" class="knob"></div></div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
